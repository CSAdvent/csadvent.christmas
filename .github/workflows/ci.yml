name: CI

on:
  push:
    branches: [main]
    # A push that only changes documentation has nothing to build, test or deploy (deploy.yml waits for this workflow), so
    # CI doesn't run at all. Keep this list in step with "Check for code changes" below, and with deploy.yml's "Choose the
    # commit".
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Pushes to main each get a group of their own, so their runs are
# never cancelled or held back: each one leads to a deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same Aspire CLI as deploy.yml. Keep the two in step.
  ASPIRE_CLI_VERSION: 13.6.3
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  ASPIRE_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build and test
    # The integration tests start the AppHost, which runs Postgres and MailPit in Docker. Pinned rather than ubuntu-latest,
    # which moves to a new Ubuntu in the middle of the season (#177). Move it on outside the season (the runbook's January).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A pull request's merge commit and its parents, to see what the pull request changes.
          fetch-depth: 2

      # A pull request that only changes documentation still runs this job, so "Build and test" passes and can never hold
      # up a required check, but it skips the build and the tests. (A workflow skipped by path filters would leave a
      # required check waiting forever, which is why pull requests don't use paths-ignore.)
      - name: Check for code changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qvE '^(README\.md|CLAUDE\.md|docs/.+)$' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed, so there's nothing to build or test."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the SDK global.json asks for (#177). setup-dotnet also installs the latest LTS runtime first, every time, which
      # cost about 40 seconds whenever that download failed. The install script is pinned to a commit of
      # dotnet/install-scripts (tag v2026.07.21), and puts the SDK beside the runner's own, where setup-dotnet did.
      - name: Setup .NET
        if: steps.changes.outputs.code != 'false'
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/dotnet-install.sh" \
            https://raw.githubusercontent.com/dotnet/install-scripts/da3ce11ba63f3dbb0fb835d41bda2665d5c48e84/src/dotnet-install.sh
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir /usr/share/dotnet --skip-non-versioned-files
          echo "DOTNET_ROOT=/usr/share/dotnet" >> "$GITHUB_ENV"
          dotnet --version

      # The build downloads Tailwind's standalone CLI (about 110 MB) into .tools/ unless it's already there.
      - name: Cache the Tailwind CLI
        if: steps.changes.outputs.code != 'false'
        uses: actions/cache@v6
        with:
          path: .tools
          key: tailwind-${{ runner.os }}-${{ hashFiles('build/Tailwind.targets') }}

      - name: Restore
        if: steps.changes.outputs.code != 'false'
        run: dotnet restore CSAdvent.slnx

      - name: Build
        if: steps.changes.outputs.code != 'false'
        run: dotnet build CSAdvent.slnx --configuration Release --no-restore

      # Generates the production Bicep as the deploy does (#178), and compiles it, so a break in the Azure-only parts of the
      # AppHost shows up here, not in the deploy after the merge. Pull requests only: on main, the deploy does the same before
      # it changes anything in Azure. "aspire do publish-azure-environment" is "aspire publish" without the migration bundle,
      # which would add about two minutes. Always the PublishCheck environment, never Production, whose saved state aspire
      # deploy reuses. The placeholders switch on the AppHost's optional parts (alerts, social posting, the blurb check);
      # publishing only declares parameters, so their values never reach the output.
      - name: Check the Azure publish
        if: github.event_name == 'pull_request' && steps.changes.outputs.code != 'false'
        env:
          # With --no-build, run what the Build step built.
          Configuration: Release
          Parameters__alert-emails: organizers@example.invalid
          Parameters__mastodon-access-token: placeholder
          Parameters__bluesky-app-password: placeholder
          Parameters__facebook-page-id: placeholder
          Parameters__facebook-page-token: placeholder
          Parameters__x-api-key: placeholder
          Parameters__x-api-key-secret: placeholder
          Parameters__x-access-token: placeholder
          Parameters__x-access-token-secret: placeholder
          Parameters__anthropic-api-key: placeholder
        run: |
          dotnet tool install --global Aspire.Cli --version "$ASPIRE_CLI_VERSION"
          # shellcheck disable=SC1010 # "do" is the Aspire command here, not the shell's keyword.
          aspire do publish-azure-environment --apphost src/CSAdvent.AppHost --output-path "$RUNNER_TEMP/publish" \
            --environment PublishCheck --no-build --non-interactive --nologo
          bicep build "$RUNNER_TEMP/publish/main.bicep" --stdout > /dev/null
          echo "The Azure publish generated and compiled."

      # Every test's result goes into a TRX file, uploaded below when a test fails (#177).
      - name: Test
        id: test
        if: steps.changes.outputs.code != 'false'
        run: dotnet test --solution CSAdvent.slnx --configuration Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Upload the test results
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7
