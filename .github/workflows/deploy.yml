name: Deploy

on:
  # Every push to main deploys once CI has passed on it, unless main has moved on to newer code by then. CI skips
  # documentation-only pushes, so they don't deploy.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # And by hand, from the Actions tab: main's latest commit, or an earlier commit of main to roll back to (the runbook's
  # Rolling Back a Deploy).
  workflow_dispatch:
    inputs:
      sha:
        description: A commit on main to deploy instead of the latest (full or short SHA). Leave it empty to deploy main.
        required: false
        default: ''

permissions:
  contents: read
  # Signs in to Azure with GitHub's OIDC token, so no Azure password is stored anywhere.
  id-token: write

# One deploy at a time, and never stop one halfway. A newer push waits, and replaces any push already waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # The same Aspire CLI as ci.yml. Keep the two in step.
  ASPIRE_CLI_VERSION: 13.6.3
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  ASPIRE_CLI_TELEMETRY_OPTOUT: 'true'

# This job can change anything in the subscription, so every action is pinned to a commit (#180), with its tag alongside for
# Dependabot, which keeps both up to date.
jobs:
  deploy:
    name: Deploy to Azure
    # A CI run for a pull request never deploys, and neither does a failed one.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Pinned rather than ubuntu-latest, which moves to a new Ubuntu in the middle of the season (#177).
    runs-on: ubuntu-24.04
    # The environment holds the secrets, and only main may deploy to it. Azure only trusts tokens for this environment.
    environment:
      name: production
      url: ${{ steps.site.outputs.url }}
    env:
      Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
      Azure__Location: ${{ vars.AZURE_LOCATION }}
      Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
      Azure__CredentialSource: AzureCli
      # az can take more than the default ~10 seconds to hand out a token while images are building.
      Azure__CredentialProcessTimeoutSeconds: '60'
      # The AppHost's parameters (Parameters:{name}), so aspire deploy never asks for them.
      Parameters__pg-admin-username: ${{ vars.PG_ADMIN_USERNAME }}
      Parameters__pg-admin-password: ${{ secrets.PG_ADMIN_PASSWORD }}
      Parameters__github-client-id: ${{ vars.OAUTH_CLIENT_ID }}
      Parameters__github-client-secret: ${{ secrets.OAUTH_CLIENT_SECRET }}
      # Automatic social posting (#61). Optional: a platform without them stays copy and paste.
      Parameters__mastodon-access-token: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      Parameters__bluesky-app-password: ${{ secrets.BLUESKY_APP_PASSWORD }}
      Parameters__facebook-page-id: ${{ vars.FACEBOOK_PAGE_ID }}
      Parameters__facebook-page-token: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      Parameters__x-api-key: ${{ secrets.X_API_KEY }}
      Parameters__x-api-key-secret: ${{ secrets.X_API_KEY_SECRET }}
      Parameters__x-access-token: ${{ secrets.X_ACCESS_TOKEN }}
      Parameters__x-access-token-secret: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      # The blurb check (#128). Optional: without it, posts aren't checked.
      Parameters__anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Who Azure Monitor's alerts go to (#139), separated by commas. Optional: without it, no alerts are set up. A secret,
      # not a variable, so the organizers' addresses never show in this workflow's log.
      Parameters__alert-emails: ${{ secrets.ALERT_EMAILS }}

    steps:
      # Only main's latest code deploys (#179). CI runs can finish out of order, so without this an older commit could deploy
      # over a newer one. A newer commit that only changes documentation doesn't count, because it never deploys by itself
      # (keep the list in step with ci.yml's). By hand, the sha input deploys an earlier commit of main instead.
      - name: Choose the commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.sha }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            sha="${REQUESTED:-$GITHUB_SHA}"
          else
            sha="$TESTED"
          fi
          if ! [[ "$sha" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::\"$sha\" isn't a commit SHA."
            exit 1
          fi
          # How main compares with the commit: "identical", "ahead" (the commit is in main's history), or "behind" and
          # "diverged" (it isn't on main).
          if ! compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq '{status, sha: .base_commit.sha, files: [(.files // [])[].filename]}'); then
            echo "::error::Couldn't find the commit $sha."
            exit 1
          fi
          status=$(jq -r .status <<< "$compare")
          sha=$(jq -r .sha <<< "$compare")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          case "$status" in
            identical)
              echo "Deploying $sha, main's latest commit."
              echo "deploy=true" >> "$GITHUB_OUTPUT" ;;
            ahead)
              if [ "$EVENT" = workflow_dispatch ]; then
                echo "::notice::Deploying $sha, an earlier commit of main. The next deploy of main replaces it."
                echo "deploy=true" >> "$GITHUB_OUTPUT"
              elif jq -r '.files[]' <<< "$compare" | grep -qvE '^(README\.md|CLAUDE\.md|docs/.+)$'; then
                echo "::notice::Skipped $sha: main has newer code, which deploys once CI passes on it."
                echo "Skipped: main has moved on from $sha to newer code, which deploys once CI passes on it." >> "$GITHUB_STEP_SUMMARY"
                echo "deploy=false" >> "$GITHUB_OUTPUT"
              else
                echo "Deploying $sha. Main has moved on, but only its documentation."
                echo "deploy=true" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              if [ "$EVENT" = workflow_dispatch ]; then
                echo "::error::$sha isn't a commit on main, so it can't be deployed."
                exit 1
              fi
              echo "::warning::Skipped $sha: it's no longer on main."
              echo "deploy=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout
        if: steps.commit.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit chosen above: the one CI just tested, or the one asked for.
          ref: ${{ steps.commit.outputs.sha }}

      # Only the SDK global.json asks for (#177): setup-dotnet also installs the latest LTS runtime first, every time. The
      # install script is pinned to a commit of dotnet/install-scripts (tag v2026.07.21), like ci.yml's.
      - name: Setup .NET
        if: steps.commit.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/dotnet-install.sh" \
            https://raw.githubusercontent.com/dotnet/install-scripts/da3ce11ba63f3dbb0fb835d41bda2665d5c48e84/src/dotnet-install.sh
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir /usr/share/dotnet --skip-non-versioned-files
          echo "DOTNET_ROOT=/usr/share/dotnet" >> "$GITHUB_ENV"
          dotnet --version

      # The build downloads Tailwind's standalone CLI (about 110 MB) into .tools/ unless it's already there.
      - name: Cache the Tailwind CLI
        if: steps.commit.outputs.deploy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tailwind-${{ runner.os }}-${{ hashFiles('build/Tailwind.targets') }}

      - name: Install the Aspire CLI and dotnet-ef
        if: steps.commit.outputs.deploy == 'true'
        run: |
          dotnet tool install --global Aspire.Cli --version "$ASPIRE_CLI_VERSION"
          dotnet tool restore

      - name: Sign in to Azure
        if: steps.commit.outputs.deploy == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # aspire deploy runs the migrations before it updates the web app (#151): its run-migrations step (MigrateFirst.cs in
      # the AppHost) starts the migrations job once the job has the new bundle, and only lets the web app be updated once the
      # job has succeeded. If the migrations fail, or don't finish within 10 minutes, the deploy fails here and the site keeps
      # running the previous version. The time limit is only a backstop, for anything in Azure that never answers.
      - name: Deploy
        if: steps.commit.outputs.deploy == 'true'
        timeout-minutes: 45
        run: aspire deploy --apphost src/CSAdvent.AppHost --non-interactive --nologo

      # Pinned (#180), so a new release can't change the steps below by itself.
      - name: Add the Azure CLI's containerapp extension
        if: steps.commit.outputs.deploy == 'true'
        run: az extension add --name containerapp --version 0.3.55 --upgrade --only-show-errors

      # Only for a commit from before #151, whose AppHost has no run-migrations step (rolling back to it, #179): its aspire
      # deploy updates the job and the web app side by side and never starts the job, so start it here, as the deploy did
      # then. Its migrations are already in the database, so it finds nothing to do. Delete this step once no commit that
      # old is worth rolling back to.
      - name: Run the migrations (a commit from before #151)
        if: steps.commit.outputs.deploy == 'true' && hashFiles('src/CSAdvent.AppHost/MigrateFirst.cs') == ''
        timeout-minutes: 15
        run: |
          execution=$(az containerapp job start -n migrations -g "$Azure__ResourceGroup" --query name -o tsv)
          echo "Started $execution."
          for _ in $(seq 1 60); do
            status=$(az containerapp job execution show -n migrations -g "$Azure__ResourceGroup" --job-execution-name "$execution" --query properties.status -o tsv)
            case "$status" in
              Succeeded) echo "The migrations succeeded."; exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::The migrations job ended as $status. Its logs are in the Azure portal, under the migrations job's execution history."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The migrations job didn't finish within 10 minutes."
          exit 1

      - name: Check the site
        id: site
        if: steps.commit.outputs.deploy == 'true'
        run: |
          host=$(az containerapp show -n web -g "$Azure__ResourceGroup" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
          # The new revision can take a minute to start.
          curl --fail --silent --show-error --output /dev/null --retry 10 --retry-delay 15 --retry-all-errors "https://$host/"
          echo "https://$host/ is up."

      # A new revision that can't start never takes traffic, so the old one keeps answering and the check above passes anyway.
      # Azure should only finish updating the web app once its new revision is ready, failing aspire deploy (MigrateFirst.cs),
      # but this makes sure. The web app refuses to start without its data protection key in Key Vault, or the role to use it
      # (#193), and this catches any other revision that never becomes ready too.
      - name: Check the new revision is serving
        if: steps.commit.outputs.deploy == 'true'
        run: |
          for _ in $(seq 1 60); do
            latest=$(az containerapp show -n web -g "$Azure__ResourceGroup" --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show -n web -g "$Azure__ResourceGroup" --query properties.latestReadyRevisionName -o tsv)
            if [ "$latest" = "$ready" ]; then
              echo "The new revision, $latest, is serving."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The new revision $latest didn't become ready within 10 minutes, so $ready is still serving. Its console logs say why (the runbook's Data Protection Key, if it's about Key Vault)."
          exit 1
