name: Lint Commit Messages

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

# Each run lints both the title and every commit, so a newer push or title edit cancels the run it replaces.
concurrency:
  group: commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    name: Lint PR Title
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/cli@18.4.3 @commitlint/config-conventional@18.4.3

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Validating PR title: $PR_TITLE"
          echo "$PR_TITLE" | npx commitlint --verbose

  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/cli@18.4.3 @commitlint/config-conventional@18.4.3

      - name: Validate PR commits
        run: |
          # Get the base branch (usually main)
          BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)

          # Lint all commits in the PR
          npx commitlint --from $BASE_SHA --to HEAD --verbose
